<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Your Own AI Dev | Burning Token</title>
  <style>
    @font-face { font-family: 'Bitter'; src: url('./assets/bitter-latin-700-normal.woff2') format('woff2'); font-display: swap; font-weight: 700; }
    @font-face { font-family: 'Bitter'; src: url('./assets/bitter-latin-500-normal.woff2') format('woff2'); font-display: swap; font-weight: 500; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('./assets/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); font-display: swap; font-weight: 400; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('./assets/ibm-plex-mono-latin-700-normal.woff2') format('woff2'); font-display: swap; font-weight: 700; }
    @font-face { font-family: 'Manrope'; src: url('./assets/manrope-latin-wght-normal.woff2') format('woff2'); font-display: swap; font-weight: 100 900; }

    :root {
      --ink: #11091e;
      --violet: #3f1495;
      --magenta: #c4088f;
      --paper: #f9f5ef;
      --surface: #ece6dd;
      --line: #dcd3c4;
      --muted: #5b5170;
      --display: 'Bitter', Georgia, serif;
      --sans: 'Manrope', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    a { color: inherit; }
    .page { position: relative; display: grid; min-height: 100dvh; overflow: hidden; background: linear-gradient(90deg, rgb(196 8 143 / .055) 1px, transparent 1px), linear-gradient(0deg, rgb(196 8 143 / .045) 1px, transparent 1px), var(--paper); background-size: 4rem 4rem; }
    .page::before { content: ''; position: absolute; width: min(48rem, 75vw); aspect-ratio: 1; right: -18rem; top: -22rem; border: 1px solid rgb(63 20 149 / .22); border-radius: 50%; background: repeating-radial-gradient(circle at center, transparent 0 3.4rem, rgb(196 8 143 / .14) 3.46rem 3.53rem); pointer-events: none; }
    .page::after { content: ''; position: absolute; width: min(30rem, 52vw); aspect-ratio: 1; left: -13rem; bottom: -18rem; border: 1px solid rgb(196 8 143 / .16); border-radius: 50%; pointer-events: none; }
    header { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4.5rem; padding: .7rem clamp(1.25rem, 5vw, 5rem); border-bottom: 1px solid var(--line); background: rgb(249 245 239 / .85); }
    .brand { display: flex; align-items: center; gap: .75rem; text-decoration: none; }
    .mark { display: grid; place-items: center; width: 2.35rem; height: 2.35rem; border: 2px solid var(--ink); background: var(--magenta); color: var(--paper); font: 700 1.25rem/1 var(--display); }
    .brand-copy { display: grid; gap: .12rem; }
    .brand-copy strong { font: 700 .95rem/1 var(--display); }
    .brand-copy span, .session { color: var(--muted); font: 500 .64rem/1.2 var(--mono); letter-spacing: .11em; text-transform: uppercase; }
    main { position: relative; z-index: 1; display: grid; align-items: center; padding: clamp(4rem, 11vh, 8rem) clamp(1.25rem, 8vw, 9rem); }
    .hero { max-width: 58rem; }
    .eyebrow { margin: 0 0 1.25rem; color: var(--violet); font: 700 .72rem/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: '+'; display: inline-grid; place-items: center; width: 1.7rem; height: 1.3rem; margin-right: .6rem; border: 1px solid var(--violet); color: var(--magenta); }
    h1 { max-width: 12ch; margin: 0; font: 700 clamp(3.1rem, 7vw, 7.25rem)/.92 var(--display); letter-spacing: -.045em; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2.2rem; }
    .cta { display: inline-flex; align-items: center; justify-content: center; min-height: 3.35rem; padding: .85rem 1.15rem; border: 2px solid var(--ink); text-decoration: none; font: 700 1rem/1 var(--sans); transition: transform .18s ease, background .18s ease, color .18s ease; }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(1px); }
    .cta:focus-visible { outline: 3px solid var(--violet); outline-offset: 4px; }
    .cta-primary { background: var(--magenta); color: var(--paper); }
    .cta-primary:hover { background: var(--violet); }
    .cta-secondary { background: var(--paper); color: var(--ink); }
    .cta-secondary:hover { background: var(--surface); }
    footer { position: relative; z-index: 1; align-self: end; padding: 1.2rem clamp(1.25rem, 5vw, 5rem); color: var(--muted); font: 700 .67rem/1 var(--mono); letter-spacing: .12em; }
    @media (max-width: 680px) { header { min-height: 4rem; } .session { display: none; } main { padding-block: 5rem; } .actions { align-items: stretch; flex-direction: column; max-width: 20rem; } .cta { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .cta { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Burning Token Workshop 2 home"><span class="mark">F</span><span class="brand-copy"><strong>Frutero Club</strong><span>Burning Token</span></span></a>
      <span class="session">Workshop 02</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="workshop-title">
        <p class="eyebrow">Create Your Own AI Dev</p>
        <h1 id="workshop-title">Build the agent that helps you build.</h1>
        <div class="actions" aria-label="Workshop paths">
          <a class="cta cta-primary" href="/presentation/">Create your own Agent</a>
          <a class="cta cta-secondary" href="/presentation/#slide-8">Educational Resources</a>
        </div>
      </section>
    </main>
    <footer>Frutero Club / Burning Token</footer>
  </div>
</body>
</html>
